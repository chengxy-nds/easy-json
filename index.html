<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/icons/icon-128.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>easyJSON - 专业级 JSON 格式化、校验与对比工具</title>
    <meta name="description" content="easyJSON 是一款简洁大气、免安装的专业级 JSON 格式化、验证与字段差异对比工具。支持实时 JSON 语法检查、错误行高亮、按 Key 排序以及字符级差异高亮的双栏同步滚动对比。" />
    <meta name="keywords" content="JSON格式化,JSON校验,JSON对比,JSON工具,JSON编辑器,JSON在线,easyJSON" />
    <link rel="canonical" href="https://easyjson.xiaofucode.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="easyJSON - 专业级 JSON 格式化、校验与对比工具" />
    <meta property="og:description" content="简洁大气、免安装的专业级 JSON 格式化、验证与字段差异对比工具" />
    <meta property="og:url" content="https://easyjson.xiaofucode.com/" />
    <meta property="og:image" content="https://easyjson.xiaofucode.com/images/logo.png" />
    <link rel="stylesheet" href="/css/css2.css" />
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('easyjson-fatal-error');
        if (!el) {
          el = document.createElement('pre');
          el.id = 'easyjson-fatal-error';
          el.style = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#1e1e1e;color:#ff5555;padding:24px;font-family:monospace;font-size:14px;z-index:9999999;overflow:auto;margin:0;box-sizing:border-box;';
          (document.body || document.documentElement).appendChild(el);
        }
        el.textContent += '\n[JS Error]: ' + e.message + '\n  at ' + e.filename + ':' + e.lineno + ':' + e.colno + '\n' + (e.error ? (e.error.stack || '') : '');
      });
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('easyjson-fatal-error');
        if (!el) {
          el = document.createElement('pre');
          el.id = 'easyjson-fatal-error';
          el.style = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#1e1e1e;color:#ff5555;padding:24px;font-family:monospace;font-size:14px;z-index:9999999;overflow:auto;margin:0;box-sizing:border-box;';
          (document.body || document.documentElement).appendChild(el);
        }
        el.textContent += '\n[Promise Rejection]: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason);
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
